name: SpecProof Go PR Gate

on:
  pull_request:
    branches: [main, master]

concurrency:
  group: specproof-go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  specproof-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: Claw2M/specproof@main
        env:
          SPECPROOF_CLOUD_TOKEN: ${{ secrets.SPECPROOF_CLOUD_TOKEN }}
        with:
          base-ref: origin/${{ github.base_ref }}
          mutate: 'true'
          fail-under: '75'
          test-command: go test ./...
          spec: SPEC.md
          post-pr-comment: 'true'
          post-check-run: 'true'
          cloud: ${{ vars.SPECPROOF_CLOUD_URL }}
